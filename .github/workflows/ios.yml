name: iOS build

# Manual by default. A macOS runner bills at ten times the rate of a Linux one,
# so a 20-minute build on every push would burn a month's free minutes in a
# couple of days. Trigger it when there is something worth putting on a phone.
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode configuration
        type: choice
        options: [Release, Debug]
        default: Release

jobs:
  # Everything that does not need a Mac runs on the cheap runner first, and the
  # expensive job does not start unless this passes.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # typecheck + 303 tests + migration syntax + a Metro bundle for iOS.
      # The bundle step is what catches native-side breakage without a Mac.
      - run: npm run verify

  ipa:
    needs: verify
    # macos-15 fails: one of React Native's SwiftPM dependencies declares Swift
    # tools 6.2, and that image's default Xcode ships 6.1. Pinned rather than
    # `macos-latest`, which moves under you the day GitHub repoints it.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Belt and braces: the image ships several Xcodes and the selected one is
      # not always the newest. Printing the versions means a future toolchain
      # mismatch is one line in the log rather than a puzzle.
      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Installed: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          swift --version

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `expo prebuild` refuses to generate the iOS project on Windows, which is
      # why this workflow exists at all. Here it works.
      #
      # Note what is *absent*: no EXPO_PUBLIC_SUPABASE_* variables. Those are
      # inlined into the bundle at build time, so this produces an app in fully
      # offline mode — workouts log locally, routine links work, squads and
      # friends do not. To change that, add them as repository secrets and set
      # them in the env of this step.
      - name: Generate the native project
        run: npx expo prebuild --platform ios --clean

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-

      - run: npx pod-install

      # The scheme is the workspace's own name — Expo derives both from
      # `expo.name`, so `Shift.xcworkspace` contains the `Shift` scheme.
      #
      # The first attempt took `schemes[0]` from `xcodebuild -list`, reasoning
      # that asking Xcode beat hardcoding. That list is mostly CocoaPods
      # targets, and it picked `EXConstants`: the build then succeeded, produced
      # a static library, and left no .app to package. A build that compiles the
      # wrong thing and exits zero is worse than one that fails, so the scheme
      # is now checked against the list rather than drawn from it.
      - name: Resolve workspace and scheme
        id: xc
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)

          if ! xcodebuild -workspace "$WORKSPACE" -list \
               | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -qx "$SCHEME"; then
            echo "Scheme '$SCHEME' is not in this workspace. It offers:"
            xcodebuild -workspace "$WORKSPACE" -list
            exit 1
          fi

          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Building $SCHEME from $WORKSPACE"

      # Built without signing on purpose.
      #
      # Signing an iOS app needs a distribution certificate and a provisioning
      # profile carrying the target device's UDID, and both require an Apple
      # Developer Program membership. An unsigned .ipa is still exactly what a
      # sideloading tool wants — Sideloadly and AltStore sign it themselves with
      # a free Apple ID on the machine that installs it.
      # No `| xcpretty`. Piping through a formatter needs `set -o pipefail` to
      # keep a failure fatal, and a fallback that reruns the command on error
      # would spend another twenty billed minutes reproducing a failure already
      # in the log.
      - name: Build (unsigned)
        run: |
          xcodebuild \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration "${{ inputs.configuration }}" \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      # An .ipa is a zip with the .app inside a folder called Payload. That is
      # the whole format — `xcodebuild -exportArchive` would do it too, but only
      # with signing credentials, which is the thing being avoided here.
      # The .app is located rather than assumed. The first attempt at this
      # hardcoded `build/Build/Products`, which was empty: a *relative*
      # -derivedDataPath is resolved by xcodebuild against the workspace
      # directory, not the working directory. The path is absolute now, and the
      # search is wide enough that being wrong about it again is not fatal.
      #
      # `-not -path "*/*.app/*"` drops app bundles nested inside other bundles,
      # which is how extensions and watch apps show up.
      - name: Package the .ipa
        id: pack
        run: |
          APP=$(find "$GITHUB_WORKSPACE/build" ios/build -name "*.app" -type d \
                     -not -path "*/*.app/*" 2>/dev/null | head -1)

          if [ -z "$APP" ]; then
            echo "No .app anywhere. Build output actually looks like this:"
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type d -name "Products" 2>/dev/null
            exit 1
          fi

          echo "Packaging $APP"
          echo "app=$APP" >> "$GITHUB_OUTPUT"

          # An .ipa is a zip with the bundle inside a folder called Payload.
          # That is the entire format.
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Shift.ipa Payload
          ls -lh Shift.ipa

      # Confirms the thing this whole project is designed around actually made
      # it into the binary. It has been verified in the resolved config and
      # never once read out of a built app.
      - name: Report the 120 Hz key
        run: |
          PLIST="${{ steps.pack.outputs.app }}/Info.plist"
          echo "== $PLIST"
          /usr/libexec/PlistBuddy -c "Print :CADisableMinimumFrameDurationOnPhone" "$PLIST" \
            || echo "MISSING — the 120 Hz key did not survive prebuild"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$PLIST" || true

      - uses: actions/upload-artifact@v4
        with:
          name: Shift-ipa-unsigned
          path: Shift.ipa
          retention-days: 14
